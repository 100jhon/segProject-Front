<div class="proyecto-container">
  <div class="header">
    <h2>Mis Tareas</h2>
    <button class="btn-agregar">+ Nueva Tarea</button>
  </div>

  <div class="tabla-proyectos">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>descripcion</th>
          <th>horaEstimada</th>
          <th>historiaEpica</th>
          <th>historiaUsuario</th>
          <th class="acciones-encabezado">
            <button class="btn-icon" title="Editar" >🔄</button>
            <button class="btn-icon" title="Eliminar">🗑️</button>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tarea of tareas; let i = index">
          <td>{{ tarea.nombre }}</td>
          <td>{{ tarea.descripcion }}</td>
          <td>{{ tarea.horaEstimada }}</td>
          <td>{{ tarea.historiaEpica }}</td>
          <td>{{ tarea.historiaUsuario }}</td>
          <td> <input type="checkbox" [(ngModel)]="tarea.seleccionado" name="check_{{i}}" /></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

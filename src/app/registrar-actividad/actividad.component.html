<div class="proyecto-container">
  <div class="header">
    <h2>Mis Actividades</h2>
    <button class="btn-agregar">+ Nueva Actividad</button>
  </div>

  <div class="tabla-proyectos">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Código</th>
          <th>Epica</th>
          <th>HU</th>
          <th>Tiempo estimado</th>
          <th class="acciones-encabezado">
            <button class="btn-icon" title="Editar" >🔄</button>
            <button class="btn-icon" title="Eliminar">🗑️</button>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let actividad of actividades; let i = index">
          <td>{{ actividad.nombre }}</td>
          <td>{{ actividad.codigoProyecto }}</td>
          <td>{{ actividad.historiaEpica }}</td>
          <td>{{ actividad.historiaUsuario }}</td>
          <td>{{ actividad.horaEstimada }}</td>
          <td> <input type="checkbox" [(ngModel)]="actividad.seleccionado" name="check_{{i}}" /></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
